<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zara Zebra and the Land of Z</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div id="overlay" class="overlay visible">
        <h1>Zara Zebra and the Land of Z</h1>
        <p>Use A/D or arrow keys to move, W/Space to jump.</p>
        <p>Defeat enemies by landing on top of them and reach the flag.</p>
        <button id="startButton">Start Game</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
